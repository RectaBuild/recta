name: MCP package CI

# Run by baseline.yml ("Baseline checks", the status check main's ruleset requires) on every pull request and
# every push to main, so a path filter can never leave that check missing.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Build against the client in this repository
        run: |
          set -euo pipefail
          cd packages/client
          npm install --no-save --ignore-scripts "viem@2.56.3" "typescript@5.9.3"
          npx tsc -p tsconfig.build.json
          npm pack
          cd ../mcp
          npm install --no-save --no-package-lock --ignore-scripts ../client/recta-client-*.tgz viem@2.56.3 typescript@5.9.3 @types/node@22.20.2 zod@3.25.76
          npx tsc -p tsconfig.build.json
          # The MetaMask agent wallet plugin: checks package.json#mm against the command table, writes oclif.manifest.json.
          node scripts/mm-manifest.mjs
      - name: The server answers initialize and tools/list over stdio
        working-directory: packages/mcp
        run: |
          set -euo pipefail
          out=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | RECTA_PRIVATE_KEY=0x1111111111111111111111111111111111111111111111111111111111111111 node dist/cli.js)
          echo "$out"
          echo "$out" | grep -q '"protocolVersion":"2025-06-18"'
          echo "$out" | grep -q '"recta_evaluate"'
          echo "$out" | grep -q '"recta_trial_evaluation"'
          if echo "$out" | grep -q '"recta_execute"'; then echo "execution tools listed without RECTA_ALLOW_EXECUTE"; exit 1; fi
          # ASTRA T5: without a key the server starts and lists only the free tools.
          free=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"recta_ledger","arguments":{}}}' | node dist/cli.js)
          echo "$free"
          names=$(echo "$free" | head -1 | grep -o '"name":"recta_[a-z_]*"' | sort | tr '\n' ' ')
          [ "$names" = '"name":"recta_fit" "name":"recta_trial_evaluation" ' ] || { echo "keyless tools/list is not exactly fit + trial: $names"; exit 1; }
          echo "$free" | tail -1 | grep -q 'no_key' || { echo "a signing tool was not refused without a key"; exit 1; }
      - name: AgentKit, GOAT, MetaMask and elizaOS adapters
        working-directory: packages/mcp
        run: node --test test/toolkits.test.mjs test/fee-funds.test.mjs test/keyless.test.mjs test/smart-account.test.mjs test/metamask.test.mjs test/elizaos.test.mjs
      - name: The elizaOS plugin is an elizaOS 2.x Plugin
        working-directory: packages/mcp
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts ../client/recta-client-*.tgz viem@2.56.3 typescript@5.9.3 @types/node@22.20.2 zod@3.25.76 @elizaos/core@2.0.5
          npx tsc -p test/tsconfig.elizaos.json
      - name: Package contents
        working-directory: packages/mcp
        run: |
          set -euo pipefail
          npm pack --dry-run 2>&1 | tee pack.txt
          grep -q 'oclif.manifest.json' pack.txt || { echo "oclif.manifest.json is missing: mm refuses the plugin without it"; exit 1; }
          grep -q 'dist/mm/commands/recta/move.js' pack.txt || { echo "the mm commands are missing"; exit 1; }
