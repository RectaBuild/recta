name: Client package CI

on:
  pull_request:
    paths: ["packages/client/**", ".github/workflows/client-*.yml"]
  push:
    branches: [main]
    paths: ["packages/client/**", ".github/workflows/client-*.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/client
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Build against the lowest and the latest viem in range
        run: |
          set -euo pipefail
          # 2.38.3 is the viem @coinbase/agentkit 0.10.4 pins: a lower peer range lets AgentKit projects install the client.
          for v in 2.38.3 "<3"; do
            rm -rf node_modules dist
            npm install --no-save --ignore-scripts "viem@$v" "typescript@5.9.3"
            npx tsc -p tsconfig.build.json
            node -e "import('./dist/index.js').then((m) => { if (typeof m.createRectaClient !== 'function') process.exit(1); console.log('viem', '$v', Object.keys(m).length, 'exports'); })"
          done
      - name: Package contents
        run: npm pack --dry-run
